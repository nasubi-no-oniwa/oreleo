<style>
/* 牛乳とクッキー：こげ茶のクッキー、白いクリーム、牛乳びんの青、すこしの赤 */
:root{
  --ink:#1c1210;
  --choco:#2e1d17;
  --cream:#fbf6ec;
  --milk:#e9f1f7;
  --blue:#2f6fb5;
  --red:#d8402a;
  --yel:#ffd23f;
  --disp:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fbeed8;color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body,button,input,select,#app,.overlay,.card,#hud{touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;touch-action:none}
button,select{font-family:var(--body)}
button:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:rgba(28,18,16,.9);color:var(--cream);border-radius:10px;padding:6px 11px;font-weight:900;font-size:13px;border:0;line-height:1.25}
#hOut{min-width:84px;text-align:center}
#hOut b{display:block;font-size:17px;letter-spacing:3px;line-height:1.1}
#hOut b i{font-style:normal;color:#5b4a44}
#hOut b i.on{color:var(--red)}
#hud{justify-content:space-between}
#hMid{flex:0 1 380px;min-width:0;text-align:center}
#hMid b{display:block;font-family:var(--disp);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;color:var(--cream);line-height:1.1}
#hMid span{font-size:11px;opacity:.85}
#endBtn{cursor:pointer;min-width:70px}
#word{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 118px);text-align:center;pointer-events:none;font-family:var(--disp);font-size:16px;line-height:1.3;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);word-break:break-all;max-height:4em;overflow:hidden}
#gauge{position:absolute;left:12px;right:12px;max-width:640px;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 66px);height:24px;border-radius:12px;background:rgba(28,18,16,.8);pointer-events:none;padding:4px 4px 4px 58px}
#gauge .in{position:relative;width:100%;height:100%;border-radius:8px;background:rgba(255,255,255,.14)}
#gFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--yel),#ff7a1a);border-radius:8px}
#gGuide{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#3fbf5a;box-shadow:0 0 0 1.5px var(--ink);display:none;animation:gpulse 1s ease-in-out infinite}
#gGuide::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;background:#1d7a33;border-radius:6px;padding:1px 6px;white-space:nowrap;margin-top:3px}
@keyframes gpulse{50%{opacity:.45}}
#gPrev{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);display:none}
#gPrev::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:rgba(28,18,16,.85);border-radius:6px;padding:1px 6px;white-space:nowrap;margin-top:3px}
#gauge small{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#fff;white-space:nowrap}
#picker{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px}
.pk{width:78px;height:78px;border-radius:50%;border:4px solid rgba(28,18,16,.9);font-family:var(--disp);font-size:36px;cursor:pointer;box-shadow:0 5px 0 rgba(28,18,16,.9);display:grid;place-items:center;line-height:1;padding:0}
.pk small{display:block;font-family:var(--body);font-weight:900;font-size:10px;margin-top:-6px}
#pkO{background:var(--choco);color:#fff}
#pkR{background:var(--cream);color:var(--ink)}
.pk[aria-pressed="true"]{outline:4px solid var(--yel);outline-offset:2px;transform:translateY(-3px)}
#hint{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);background:rgba(28,18,16,.9);color:var(--cream);font-weight:900;font-size:13px;padding:9px 12px;border-radius:999px;border:2px solid var(--yel);pointer-events:none;max-width:calc(100% - 200px);text-align:center;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;padding:0 16px}
#msgBig{font-family:var(--disp);font-size:clamp(40px,13vw,68px);line-height:1.05;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#msgBig.bad{color:#ff8a6a}
#msgSub{margin-top:8px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.6)}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-size:28px;color:#ff8a6a;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:popup 1.3s ease-out forwards;white-space:nowrap}
.pop.good{color:var(--yel);font-size:22px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}

/* 読み上げ */
#readBox{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);padding:0 14px;text-align:center;pointer-events:none}
#readTxt{display:inline-block;max-width:100%;background:rgba(28,18,16,.82);border-radius:14px;padding:10px 14px;font-family:var(--disp);font-size:clamp(22px,7vw,34px);line-height:1.25;color:rgba(255,255,255,.28);word-break:break-all;max-height:42vh;overflow:hidden}
#readTxt span.on{color:#fff}
#readTxt span.now{color:var(--yel)}
#readN{margin-top:6px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 3px #000}
#skipBtn{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:15px;padding:10px 16px;cursor:pointer;border:2px solid var(--yel)}
#recChip{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--red);color:#fff;font-weight:900;font-size:14px;padding:6px 14px;border-radius:999px;pointer-events:none}
#recChip::before{content:"● ";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.overlay{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:safe center;background:rgba(28,18,16,.45);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.card{position:relative;width:min(100%,420px);background:var(--cream);border-radius:18px;padding:22px 18px 18px;text-align:center;box-shadow:0 0 0 4px var(--choco),0 18px 40px rgba(0,0,0,.45)}
.card h1{font-family:var(--disp);font-weight:400;font-size:clamp(28px,9.6vw,50px);line-height:1.05;margin:8px 0 0;color:var(--ink);white-space:nowrap}
.card h1 .o{color:var(--choco)}
.card h1 .r{color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.card h1 .q{color:var(--red);font-size:.7em}
.sub{font-weight:900;font-size:14px;margin:10px 0 0}
.card h2{font-family:var(--disp);font-weight:400;font-size:24px;margin:6px 0 0;line-height:1.25}
.big{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-size:clamp(18px,5.6vw,22px);background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 14px 13px;cursor:pointer;box-shadow:0 4px 0 #1d4777;white-space:nowrap}
.big.alt{background:transparent;color:var(--ink);border:2px solid var(--choco);box-shadow:none;font-size:16px;padding:9px}
.big.x{background:#000;color:#fff;box-shadow:0 4px 0 #444;font-size:17px}
.big.rec{background:var(--red);box-shadow:0 4px 0 #8e2a1b;font-size:17px}
.big:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px}.row2 .big{flex:1}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.langs button{font:700 13px var(--body);background:transparent;color:var(--ink);border:1.5px solid rgba(28,18,16,.45);border-radius:999px;padding:4px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--choco);color:var(--cream);border-color:var(--choco)}
.how{margin:14px 0 0;padding:10px 12px;background:#fff;border-radius:10px;text-align:left;font-size:13px;font-weight:700;line-height:1.65}
.how b{color:var(--red)}
.vbox{margin-top:12px;padding:10px 12px;background:#fff;border-radius:10px;text-align:left}
.vbox p{margin:0 0 6px;font-size:12px;font-weight:900}
.vtypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vtypes button{font:900 13px var(--body);background:var(--milk);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:7px 4px;cursor:pointer}
.vtypes button[aria-pressed="true"]{border-color:var(--choco);background:var(--yel)}
.vrow{display:flex;gap:6px;margin-top:8px}
.vrow select{flex:1;min-width:0;font:700 13px var(--body);padding:7px 6px;border-radius:9px;border:2px solid var(--choco);background:#fff;color:var(--ink)}
.vrow button{font:900 13px var(--body);background:var(--choco);color:var(--cream);border:0;border-radius:9px;padding:0 12px;cursor:pointer;white-space:nowrap}
.small-note{font-size:12px;font-weight:700;color:#6b4a35;margin:8px 0 0;line-height:1.5}

.res-big{font-family:var(--disp);font-size:20px;line-height:1.2;margin:6px 0 0;color:var(--choco)}
.res-score{font-family:var(--disp);font-size:56px;font-variant-numeric:tabular-nums;line-height:1;margin-top:6px}
.res-score small{font-family:var(--body);font-weight:900;font-size:18px;margin-left:4px}
.res-word{margin-top:10px;padding:8px 10px;background:var(--choco);color:#fff;border-radius:10px;font-family:var(--disp);font-size:18px;line-height:1.3;word-break:break-all;max-height:7.2em;overflow-y:auto}
.note{margin:8px 0 0;font-weight:700;font-size:13px;min-height:1.2em;line-height:1.5}
.note.err{color:var(--red)}
.entry{display:flex;gap:8px;margin-top:12px}
.entry input{flex:1;min-width:0;font:700 16px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--choco);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.entry button{font:900 15px var(--body);background:var(--choco);color:var(--cream);border:0;border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.entry button:disabled{opacity:.5}
.rlist{list-style:none;margin:10px 0 0;padding:0;max-height:min(40vh,320px);overflow-y:auto;text-align:left;border-top:2px solid var(--choco)}
.rlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 2px;border-bottom:1px solid rgba(28,18,16,.2)}
.rlist .no{font-family:var(--disp);text-align:center;color:var(--red);grid-row:span 2}
.rlist .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .sc{font-family:var(--disp);font-size:16px;font-variant-numeric:tabular-nums;grid-row:span 2}
.rlist .wd{font-family:var(--disp);font-size:11px;color:#6b4a35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .me .nm{color:var(--red)}
.rempty{padding:14px 0;font-weight:700;text-align:center;display:block!important}
.vid{width:100%;max-height:46vh;border-radius:12px;background:#000;margin-top:10px;display:block}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--ink);background:#fbeed8}
#recCv{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:1s}}
</style>
<!-- nasubi-track: 結果画面とXへの投稿の回数を記録（ゲームの動きには影響しない） -->
<script>(function(){try{var G="oreleo",IDS=["resP"];
function ev(n){try{if(typeof gtag==='function')gtag('event',n,{game:G});}catch(e){}}
var o=window.open;window.open=function(u){try{if(/intent\/(post|tweet)/.test(String(u)))ev('x_share');}catch(e){}return o.apply(window,arguments);};
if(!IDS.length)return;
function vis(e){if(!e||!e.isConnected||e.closest('[hidden]'))return false;var r=e.getBoundingClientRect();if(r.width<1||r.height<1)return false;for(var n=e;n&&n.nodeType===1;n=n.parentElement){var s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity)<0.05)return false;}return true;}
var was={};setInterval(function(){try{var any=false;for(var i=0;i<IDS.length;i++){if(vis(document.getElementById(IDS[i])))any=true;}if(any&&!was.v)ev('result_view');was.v=any;}catch(e){}},700);
}catch(e){}})();</script>
<!-- nasubi-ad: 結果画面のいちばん下に広告の帯を1つだけ出す（遊んでいる最中は出さない・ボタンに重ねない） -->
<script>(function(){try{var IDS=["resP"],AD='https://nasubi-no-oniwa.github.io/ad/';
if(/[?&]noad=1/.test(location.search))return;var T=/[?&]adtest=1/.test(location.search);
var ifr=null,boxes={};
function vis(e){if(!e||!e.isConnected||e.closest('[hidden]'))return false;var r=e.getBoundingClientRect();if(r.width<1||r.height<1)return false;for(var n=e;n&&n.nodeType===1;n=n.parentElement){var s=getComputedStyle(n);if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity)<0.05)return false;}return true;}
function el(sp){var q=sp.split('@'),e=document.getElementById(q[0]);return e&&q[1]?e.closest(q[1]):e;}
function box(id){var b=boxes[id];if(!b){b=document.createElement('div');b.className='nsb-ad';b.style.cssText='display:block;width:320px;max-width:100%;height:50px;margin:12px auto 0;overflow:hidden;flex:0 0 auto;'+(T?'background:#ccc;outline:1px dashed #888;':'');boxes[id]=b;}return b;}
function place(){for(var i=0;i<IDS.length;i++){var e=el(IDS[i]);if(e&&box(IDS[i]).parentNode!==e)e.appendChild(box(IDS[i]));}}
function tick(){try{place();for(var i=0;i<IDS.length;i++){var e=el(IDS[i]);if(vis(e)){var b=box(IDS[i]);if(!ifr){ifr=document.createElement('iframe');ifr.title='ad';ifr.setAttribute('scrolling','no');ifr.width=320;ifr.height=50;ifr.style.cssText='border:0;width:320px;height:50px;display:block;max-width:100%';ifr.src=AD;}if(ifr.parentNode!==b)b.appendChild(ifr);return;}}}catch(_){}}
function go(){place();try{new MutationObserver(place).observe(document.body,{childList:true,subtree:true});}catch(_){}setInterval(tick,700);}
if(document.body)go();else document.addEventListener('DOMContentLoaded',go);
}catch(e){}})();</script>

<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="pops"></div>
  <div id="hud" hidden>
    <div class="chip" id="hOut"><span data-i="outL">アウト</span><b id="hOutB"><i>●</i><i>●</i><i>●</i></b></div>
    <div class="chip" id="hMid"><b id="hScore">0</b><span data-i="stackL">積んだ数</span></div>
    <button class="chip" id="endBtn" data-i="end">おわる</button>
  </div>
  <div id="word" hidden></div>
  <div id="gauge" hidden><div class="in"><div id="gFill"></div><div id="gPrev"></div><div id="gGuide"></div></div><small data-i="power">ちから</small></div>
  <div id="picker" hidden>
    <button class="pk" id="pkO" aria-pressed="true" aria-label="オ"><span>オ<small data-i="choco">チョコ</small></span></button>
    <button class="pk" id="pkR" aria-pressed="false" aria-label="レ"><span>レ<small data-i="creamS">クリーム</small></span></button>
  </div>
  <div id="hint" hidden></div>
  <div id="msg" hidden><div id="msgBig"></div><div id="msgSub"></div></div>
  <div id="readBox" hidden><div id="readTxt"></div><div id="readN"></div></div>
  <button id="skipBtn" class="chip" hidden data-i="skip">とばす ▶▶</button>
  <div id="recChip" hidden data-i="recNow">録画中</div>

  <!-- タイトル -->
  <div class="overlay" id="titleP">
    <div class="card">
      <h1><span class="o">オ</span><span class="q">？</span><span class="r">レ</span><span class="q">？</span><span class="r">レ</span><span class="q">？</span><span class="o">オ</span><span class="q">？</span></h1>
      <p class="sub" data-i="sub">シーソーで飛ばして、積んで、読まれる。</p>
      <div class="how" data-ih="how"></div>
      <div class="vbox">
        <p data-i="voiceH">読み上げの声</p>
        <div class="vtypes" id="vtypes"></div>
        <div class="vrow"><select id="vsel" aria-label="voice"></select><button id="vtest" data-i="vtest">ためす</button></div>
      </div>
      <button class="big" id="startBtn" data-i="start">あそぶ（音が出ます）</button>
      <button class="big alt" id="goRank" data-i="rank">ランキング</button>
      <div class="langs" role="group" aria-label="Language"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">繁中</button><button data-lang="ko">한국어</button></div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="overlay" id="resP" hidden>
    <div class="card">
      <p class="res-big" data-i="resH">あなたのオレオ</p>
      <div class="res-score" id="resS"></div>
      <div class="res-word" id="resW"></div>
      <p class="note" id="resSub"></p>
      <button class="big alt" id="readAgain" data-i="readAgain">🔊 もう一度読み上げる</button>
      <button class="big rec" id="recBtn" data-i="recBtn">🎬 読み上げ動画をつくる</button>
      <button class="big x" id="resShare" data-i="share">Xに投稿（文だけ）</button>
      <div class="entry"><input id="nameIn" maxlength="12" data-ip="namePh" placeholder="名前（12文字まで）" autocomplete="nickname"><button id="send" data-i="send">登録</button></div>
      <p class="note" id="sendMsg"></p>
      <ol class="rlist" id="rlist"></ol>
      <div class="row2"><button class="big" id="resRetry" data-i="retry">もう一回</button><button class="big alt" id="resTitle" data-i="toTitle">タイトルへ</button></div>
    </div>
  </div>

  <!-- 動画 -->
  <div class="overlay" id="vidP" hidden>
    <div class="card">
      <h2 data-i="vidH">動画ができた</h2>
      <video class="vid" id="vidEl" controls playsinline></video>
      <p class="note" id="vidNote"></p>
      <button class="big x" id="vidShare" data-i="vidShare">共有する（Xアプリへ）</button>
      <button class="big" id="vidSave" data-i="vidSave">保存する</button>
      <button class="big alt" id="vidBack" data-i="back">もどる</button>
    </div>
  </div>

  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), d = Math.hypot(x, z); if (d < r * .98) continue; const a = Math.atan2(z, x), k = 1 + .035 * Math.sin(a * n); p.setX(i, x * k); p.setZ(i, z * k); }

const { Engine, Bodies, Body, Composite, Events } = Matter;

engine.gravity.y = 1;
const W = (x, y) => ({ x: x * S, y: -y * S });
Composite.add(engine.world, [
  Bodies.rectangle(0, 50, 8000, 100, { isStatic: true, friction: .9, label: 'floor' }),
  Bodies.rectangle(PX * S, -(PY - .4) * S, PLATE_W * S, 80, { isStatic: true, friction: .95, label: 'plate', chamfer: { radius: 4 } }),

let READ = null;
function startRead(again) {

  const list = stackPieces().filter(p => p.st === 'stack').sort((a, b) => a.body.position.y < b.body.position.y ? 1 : -1);
  const w = list.map(p => p.k).join('');
  READ = { list, w, i: -1, t: 0, dur: 0, started: false, done: false, ut: null, again: !!again };
  $('#word').hidden = true; $('#hud').hidden = true;
  $('#readTxt').innerHTML = w ? w.split('').map(c => `<span>${KANA[c]}</span>`).join('') : esc(tr('none'));
  $('#readN').textContent = tr('readN', { n: w.length });
  $('#readBox').hidden = false; $('#skipBtn').hidden = false;
  if (!w) { READ.done = true; setTimeout(finishRead, 900); return; }
  const n = w.length, t = vt();
  READ.dur = n * .16 / t.rate + .2; // 目安（声が終わったら合わせる）
  const begin = () => { if (READ && !READ.started) { READ.started = true; READ.t = 0; } };
  if (HAS_TTS) {
    try {
      speechSynthesis.cancel();

      const CH = 16, R = READ; R.chunks = []; R.ci = -1; R.ct = 0;

        u.onstart = () => { if (READ !== R) return; begin(); R.ci = k; R.ct = 0; };
        u.onend = () => { if (READ !== R) return; if (k === R.chunks.length - 1) { R.done = true; setTimeout(finishRead, 700); } };
        u.onerror = () => { if (READ !== R || R.done) return; R.done = true; setTimeout(finishRead, 300); };

  } else { // 読み上げがない端末は、動画用の声で
    loadClips().then(() => { const d = playClipsSeq(w); READ.dur = d || READ.dur; begin(); setTimeout(() => { if (READ && !READ.done) { READ.done = true; setTimeout(finishRead, 600); } }, ((d || READ.dur) + .3) * 1000); });
  }

    const mix = AC.createGain(); mix.connect(dest); mix.connect(AC.destination);

};
function stopRec(cancel) {

const rctx = recCv.getContext('2d');
function recFrame(dt) {
  const R = REC; R.t += dt;
  const ts = R.t - R.intro, n = R.w.length;
  let i = -1; for (let k = 0; k < n; k++) if (ts >= R.at[k]) i = k;
  // カメラ：最初は全体→下から読みながら上へ→最後に全体
  const top = n ? R.list[n - 1].body.position.y / -S : PY, bot = PY;
  let fy, span;
  const whole = () => { fy = (bot + top) / 2 + .3; span = Math.max(4.5, top - bot + 3); };
  if (ts < 0 || i < 0) whole();
  else if (ts > (R.at[n - 1] || 0) + .5) whole();
  else { const yy = R.list[i].body.position.y / -S; fy = yy + .4; span = 4.2; }
  const t = recCam.userData; if (!t.fy) { t.fy = fy; t.span = span; }
  t.fy += (fy - t.fy) * Math.min(1, dt * 4); t.span += (span - t.span) * Math.min(1, dt * 3);
  const d = (t.span / 2) / Math.tan(THREE.MathUtils.degToRad(recCam.fov / 2));
  recCam.position.set(PX - .4, t.fy + .9, d + 1); recCam.lookAt(PX, t.fy, 0);
  recR.render(scene, recCam);
  const g = rctx; g.clearRect(0, 0, RW, RH); g.drawImage(recR.domElement, 0, 0, RW, RH);
  // 上：ゲーム名
  g.textAlign = 'center'; g.lineJoin = 'round';
  g.font = '44px "Dela Gothic One", sans-serif'; g.lineWidth = 8; g.strokeStyle = '#1c1210'; g.fillStyle = '#fff';
  g.strokeText('オ？レ？レ？オ？', RW / 2, 74); g.fillText('オ？レ？レ？オ？', RW / 2, 74);
  // 下：読んでいる文字
  const kana = toKana(R.w), fs = n > 60 ? 26 : n > 30 ? 32 : 40, per = Math.floor((RW - 40) / fs), rows = Math.ceil(n / per);
  const maxRows = 6, start = Math.max(0, Math.min(Math.floor(Math.max(i, 0) / per) - maxRows + 2, rows - maxRows));
  const showRows = Math.min(rows, maxRows), boxH = showRows * fs * 1.25 + 30, by = RH - boxH - 60;
  g.fillStyle = 'rgba(28,18,16,.82)'; roundRect(g, 14, by, RW - 28, boxH, 18); g.fill();
  g.font = fs + 'px "Dela Gothic One", sans-serif'; g.textAlign = 'left';
  for (let rI = 0; rI < showRows; rI++) {
    const row = start + rI, a = row * per, b = Math.min(n, a + per), w = (b - a) * fs, x0 = (RW - w) / 2;
    for (let k = a; k < b; k++) { g.fillStyle = k < i ? '#fff' : k === i ? '#ffd23f' : 'rgba(255,255,255,.28)'; g.fillText(kana[k], x0 + (k - a) * fs, by + 15 + fs + rI * fs * 1.25 - fs * .15); }
  }
  g.textAlign = 'center'; g.font = '28px "Dela Gothic One", sans-serif'; g.lineWidth = 6;
  const lab = tr('vidText', { n }); g.strokeText(lab, RW / 2, RH - 22); g.fillStyle = '#ffd23f'; g.fillText(lab, RW / 2, RH - 22);
  if (R.t >= R.total) stopRec(false);
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

/* ===================== カメラ ===================== */
const camT = { look: new THREE.Vector3(.4, 3, 0), pos: new THREE.Vector3(.4, 4, 20) };
const camLook = camT.look.clone();
function fitCam(xmin, xmax, ymin, ymax, padTop = .14, padBot = .16, aspect = camera.aspect, cam = camera) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const hW = (xmax - xmin) / 2, hH = (ymax - ymin) / 2 / (1 - padTop - padBot);
  const d = Math.max(hH / tanV, hW / (tanV * aspect));
  const visH = 2 * d * tanV, cy = ymin - padBot * visH + visH / 2;
  return { look: new THREE.Vector3((xmin + xmax) / 2, cy, 0), pos: new THREE.Vector3((xmin + xmax) / 2 - .3, cy + 1.2, d) };
}
function stackTop() { let t = PY; for (const p of PIECES) if ((p.st === 'stack') && p.body) t = Math.max(t, -p.body.position.y / S + .2); return t; }
function updateCam(dt) {
  let f;
  if (mode === 'title') { f = fitCam(-3.9, 4.1, -.2, 5.5, .05, .05); }
  else if (mode === 'read' && READ && READ.list.length) {
    const i = Math.max(0, READ.i), p = READ.list[Math.min(i, READ.list.length - 1)], y = -p.body.position.y / S;
    f = fitCam(PX - 2.4, PX + 2.4, y - 2.6, y + 2.2, .1, .3);
  } else {
    let top = stackTop(); if (RUN && RUN.flying && RUN.flying.body && RUN.flying.st === 'fly') top = Math.max(top, -RUN.flying.body.position.y / S);
    const wTop = mode === 'charge' ? PVY + H + 2 : 0;
    f = fitCam(-3.9, 4.1, -.2, Math.max(top + 2.4, 5.5, wTop), .2, .16);
  }
  camT.look.copy(f.look); camT.pos.copy(f.pos);
  const k = Math.min(1, dt * 3);
  camera.position.lerp(camT.pos, k); camLook.lerp(camT.look, k); camera.lookAt(camLook);
}

/* ===================== まわす ===================== */
let lastT = performance.now(), acc = 0;
const STEP = 1000 / 60, SUB = 3;
function frame(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('#msg').hidden = true; }

  // シーソーと重り
  if (mode === 'charge') {
    H = Math.min(HMAX, H + HRATE * dt); chargeTick -= dt; if (chargeTick <= 0) { chargeTick = .09; SND.charge(H); }
    $('#gFill').style.width = (H / HMAX * 100) + '%';
  } else if (mode === 'aim') $('#gFill').style.width = '0%';
  const le = boardEnd(boardAng, -1);
  if (mode === 'drop' && drop) {
    if (drop.h0 == null) drop.h0 = drop.y;
    drop.vy -= 45 * dt; drop.y += drop.vy * dt;
    if (drop.y <= 0) { drop.y = 0; SND.thud(); boardTarget = ALPHA; launch(); }
  }
  boardAng += (boardTarget - boardAng) * Math.min(1, dt * (boardTarget > 0 ? 40 : 6));
  seesaw.rotation.z = boardAng;
  const wy = mode === 'charge' ? H : mode === 'drop' && drop ? drop.y : (drop && drop.y === 0 ? 0 : .15);
  weight.position.set(le.x, le.y + wy, 0); weight.rotation.z = (mode === 'drop' || mode === 'wait') && drop && drop.y === 0 ? boardAng : 0;
  const mk = RUN ? (RUN.shots === 0 ? GUIDE_H : RUN.prevH) : null;
  prevMark.visible = !!(RUN && mk != null && (mode === 'aim' || mode === 'charge'));
  if (prevMark.visible) { prevMark.position.set(le.x, boardEnd(-ALPHA, -1).y + mk + .35, -.6); prevMark.material.color.setHex(RUN.shots === 0 ? 0x3fbf5a : 0xffd23f); }
  for (const p of PIECES) if (p.st === 'board') placeOnBoard(p);

  // 物理
  if (RUN && !RUN.freeze) {
    acc += dt * 1000; let n = 0;
    while (acc >= STEP && n < 5) { for (let k = 0; k < SUB; k++) Engine.update(engine, STEP / SUB); acc -= STEP; n++; }
    if (n === 5) acc = 0;
    let fellNow = 0, fx = 0, fy = 0;
    for (const p of PIECES) {
      if (!p.body) continue;
      const b = p.body, x = b.position.x / S, y = -b.position.y / S;
      p.mesh.position.set(x, y, 0); p.mesh.rotation.z = -b.angle;
      if (p.st === 'fly' || p.st === 'stack') {
        const low = y < PY - .4 && (p.st === 'stack' || (p.t > .3 && b.velocity.y > 0));
        if (low || x < -8 || x > 14) { p.st = 'out'; p.t = 0; fellNow++; fx = x; fy = Math.max(y, PY); continue; }
      }
      if (p.st === 'fly') {
        p.t += dt; const sp = Body.getSpeed(b) + Math.abs(Body.getAngularVelocity(b)) * 30;
        if (p.t > .4 && sp < .25) p.still += dt; else p.still = 0;
        if (p.still > .35 || p.t > 5) { p.st = 'stack'; }
      }
      if (p.st === 'out') { p.t += dt; if (p.t > 2) { Composite.remove(engine.world, b); scene.remove(p.mesh); p.body = null; p.dead = true; } }
    }
    PIECES = PIECES.filter(p => !p.dead);
    if (fellNow && mode !== 'over') {
      RUN.outs += fellNow; SND.out();
      pop(fx, fy + .5, 0, fellNow > 1 ? tr('out') + '×' + fellNow : tr('out'));
      updateHUD();
      if (RUN.outs >= 3 && mode !== 'over') gameOver(true);
    }
    // 次のクッキー
    if (mode === 'wait' && RUN.flying && RUN.flying.st !== 'fly') {
      const f = RUN.flying; RUN.flying = null;
      if (f.st === 'stack') pop(f.mesh.position.x, f.mesh.position.y + .6, 0, '+1', 'good');
      updateHUD();
      if (mode === 'wait') { boardTarget = -ALPHA; drop = null; H = 0; loadPiece(); mode = 'aim'; hint(tr('hintAim')); }
    }
    if (mode === 'over') {
      RUN.endT -= dt;
      const flying = PIECES.some(p => p.st === 'fly');
      if (RUN.endT <= 0 && (!flying || RUN.endT < -2.5)) startRead();
    }
  }
  if (mode === 'read') stepRead(dt);
  updateCam(dt);
  renderer.render(scene, camera);
  if (mode === 'rec' && REC) recFrame(dt);
  requestAnimationFrame(frame);
}

  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
